services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: petlink
      POSTGRES_USER: petlink
      POSTGRES_PASSWORD: petlink_dev_password
    ports:
      - "5432:5432"
    volumes:
      - petlink-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U petlink -d petlink"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  petlink-postgres:

